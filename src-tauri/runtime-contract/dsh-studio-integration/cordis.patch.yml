# Compose the desktop-owned client seam around the upstream Web profile.
# Browse remains the universal directory flow; the injected Studio client adds
# a native shortcut only when the page is inside the local Tauri shell.
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-auto'
  disabled: true
- insert:
    - id: dsh-studio-directory-picker-browse-host
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: dsh-studio-directory-picker-browse-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
    - id: dsh-studio-client-integration
      name: '@moresyl/dsh-studio-integration'
# dshmarket's one-click self-restart spawns a detached replacement the
# supervisor never sees, stranding one more dsh instance on the profile per
# use. Studio owns harness restarts, so the market's is off: its banner then
# points the user at a manual restart, which Studio performs.
- id: dsh-market
  config:
    allowRestart: false
